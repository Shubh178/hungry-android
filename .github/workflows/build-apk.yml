name: Build HUNGRY APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'hungry.html'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Android WebView wrapper project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/hungry/kya/pakaye
          cp hungry.html app/src/main/assets/index.html
          cat > settings.gradle <<'GRADLE'
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name = 'HUNGRY'
include ':app'
GRADLE
          cat > build.gradle <<'GRADLE'
plugins {
    id 'com.android.application' version '8.5.2' apply false
}
GRADLE
          cat > app/build.gradle <<'GRADLE'
plugins { id 'com.android.application' }
android {
    namespace 'com.hungry.kya.pakaye'
    compileSdk 35
    defaultConfig {
        applicationId 'com.hungry.kya.pakaye'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0-Patch80'
    }
}
GRADLE
          cat > app/src/main/AndroidManifest.xml <<'XML'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
  <application android:label="HUNGRY" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="true"> <activity android:name=".MainActivity" android:exported="true"> <intent-filter> <action android:name="android.intent.action.MAIN" /> <category android:name="android.intent.category.LAUNCHER" /> </intent-filter> </activity> </application>
</manifest>
XML
          cat > app/src/main/java/com/hungry/kya/pakaye/MainActivity.java <<'JAVA'
package com.hungry.kya.pakaye;
import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebView;
import android.webkit.WebSettings;
import android.webkit.WebViewClient;
public class MainActivity extends Activity {
  @Override public void onCreate(Bundle savedInstanceState) {
    super.onCreate(savedInstanceState);
    WebView web = new WebView(this);
    WebSettings s = web.getSettings();
    s.setJavaScriptEnabled(true);
    s.setDomStorageEnabled(true);
    s.setAllowFileAccess(true);
    web.setWebViewClient(new WebViewClient());
    web.loadUrl("file:///android_asset/index.html");
    setContentView(web);
  }
  @Override public void onBackPressed() { super.onBackPressed(); }
}
JAVA
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HUNGRY-Patch80-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
